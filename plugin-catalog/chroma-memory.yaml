title: Chroma Memory
description: 'Uses a Chroma collection you already keep as Hermes memory. chroma_recall returns nearest passages; each primary turn prefetches them. Disclosure — reads and writes it under plugin-data/chroma-memory, on CHROMA_SERVER_URL, or on api.trychroma.com (Chroma); over plain http the key is sent in X-Chroma-Token unencrypted; a finished primary turn stores the user text and assistant text with no approval, so a remote server receives the conversation; cron and subagent turns are not stored; downloads the 79.3 MiB archive from chroma-onnx-models.s3.amazonaws.com (AWS S3) and checks sha256 only when absent and CHROMA_MODEL_DOWNLOAD is 1, true, or yes; prefetch and turn storage do not download it; enable installs chromadb.'
maintainer: TakeshiTGAL
tier: community
category: memory
requires_hermes: '>=0.21.4'
