description: "Mesh Check reads one local STL, OBJ, PLY, GLB, or glTF file and returns whether it is closed, its volume, its bounds, and mesh, animation, and material counts. Use it before a 3D print or a game export. Disclosure — reads any local file path the agent passes (following symlinks) that ends in .stl, .obj, .ply, .glb or .gltf, up to 32 MiB including glTF buffer files in the same directory, and returns only measurements and mesh names; no network, file writes, rendering or repair; enabling it installs trimesh, pygltflib and numpy."
